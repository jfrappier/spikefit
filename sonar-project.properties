# SonarCloud project configuration
# Replace YOUR_ORG with your SonarCloud organization key (visible in SonarCloud → My Account → Organizations)
# Replace YOUR_PROJECT_KEY with the project key set when you added this repo in SonarCloud

sonar.projectKey=jfrappier_volleyfit
sonar.organization=jfrappier
sonar.projectName=SpikeFit

# Scan all source files from the repo root
sonar.sources=.

# Mark test directories explicitly so SonarCloud tracks coverage and test metrics separately
sonar.tests=tests

# Exclude files that should not be analyzed:
#   fonts/          — binary font files
#   img/            — binary image files
#   tests/unit/qunit/ — vendored QUnit library (not our code)
sonar.exclusions=fonts/**,img/**,tests/unit/qunit/**

# Test file patterns (scanned but reported as tests, not source)
sonar.test.inclusions=tests/e2e/**,tests/unit/*.test.js

sonar.sourceEncoding=UTF-8

# Python version used in tests/e2e/
sonar.python.version=3
